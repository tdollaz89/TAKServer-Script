# Default settings for takbuild.sh.
# Don't edit this file per server — copy it (or one of examples/) and pass it with -c.
# Anything left empty is prompted for (or auto-detected) when the script runs.

# --- Installer -----------------------------------------------------------------
# Folder holding installers downloaded from tak.gov (.deb, .rpm, takserver-docker-*.zip).
INSTALLER_DIR="$SCRIPT_DIR/installers"
# Set to a specific file to skip the version menu.
INSTALLER=""
# auto | native | docker — "auto" shows both kinds in the menu.
INSTALL_MODE="auto"

# --- Server ---------------------------------------------------------------------
# Address clients connect to. Empty = this machine's primary IP.
# On a cloud VPS, set this to the PUBLIC IP or DNS name.
SERVER_ADDRESS=""
# Name shown for the connection in ATAK/iTAK.
CONNECTION_NAME="TAK Server"
# auto | takserver | takserver-noplugins (auto picks noplugins on a Pi or < 8 GB RAM).
TAK_SERVICE="auto"
# Seconds to wait for TAK Server to come up after (re)start.
START_TIMEOUT=600

# --- Certificates ---------------------------------------------------------------
CA_NAME="TAK-ROOT-CA"
SERVER_CERT_NAME="takserver"
# Password on all generated keystores/.p12 files. atakatak is TAK's well-known default — change it.
CERT_PASS="atakatak"
CERT_COUNTRY="US"
CERT_STATE=""
CERT_CITY=""
CERT_ORG="TAK"
CERT_OU="TAK"

# --- Users ----------------------------------------------------------------------
# Space-separated client usernames. Each gets a cert and a data package.
USERS="user1 user2"
# Optional space-separated groups to put every user in (empty = default anonymous group).
USER_GROUPS=""

# --- Firewall -------------------------------------------------------------------
CONFIGURE_FIREWALL=1
# 8089 = client TLS, 8443 = web admin, 8446 = cert enrollment.
TAK_PORTS="8089 8443 8446"
SSH_PORT=22

# --- Docker installs only -----------------------------------------------------
DOCKER_BASE_DIR="/opt/tak-docker"
DOCKER_DB_DIR="/opt/tak-docker/db-data"
DOCKER_PORTS="8089 8443 8444 8446 9000 9001"

# --- Output ---------------------------------------------------------------------
# Where data packages, admin cert and the log go. Empty = output/<hostname>-<timestamp>.
OUTPUT_DIR=""
